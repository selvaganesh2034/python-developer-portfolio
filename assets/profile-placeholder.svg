<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="450" fill="url(#bgGrad)" />

  <!-- Geometric Decorative Lines -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity="0.6" />

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="160" r="55" fill="url(#faceGrad)" />
  <!-- Hair / Cap -->
  <path d="M 145 160 C 145 110, 255 110, 255 160 C 240 130, 160 130, 145 160 Z" fill="#0f172a" />
  
  <!-- Modern Glasses -->
  <rect x="165" y="152" width="28" height="18" rx="4" fill="none" stroke="#0f172a" stroke-width="3" />
  <rect x="207" y="152" width="28" height="18" rx="4" fill="none" stroke="#0f172a" stroke-width="3" />
  <line x1="193" y1="160" x2="207" y2="160" stroke="#0f172a" stroke-width="3" />

  <!-- Smile -->
  <path d="M 185 185 Q 200 198 215 185" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />

  <!-- Shoulders & Body / Hoodie -->
  <path d="M 110 320 C 110 245, 150 230, 200 230 C 250 230, 290 245, 290 320 L 290 450 L 110 450 Z" fill="#1e293b" />
  <path d="M 155 235 L 200 290 L 245 235" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 200 290 L 200 370" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Python Logo Symbol Badge at Chest -->
  <circle cx="200" cy="340" r="24" fill="#0b0f19" stroke="url(#glowGrad)" stroke-width="2" />
  <text x="200" y="348" font-family="monospace" font-weight="bold" font-size="20" fill="#34d399" text-anchor="middle">&lt;/&gt;</text>

  <!-- Bottom Label -->
  <rect x="90" y="400" width="220" height="32" rx="16" fill="#0b0f19" stroke="#334155" stroke-width="1" />
  <text x="200" y="421" font-family="sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Your Photo Here (assets/profile.jpg)</text>
</svg>

